[project]
name = "aura-agent"
version = "0.1.0"
description = "AURA — a tiny autonomous AI agent: ReAct loop, tools, and memory in pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
aura = "aura.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aura*"]
